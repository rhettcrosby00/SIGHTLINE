<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Sightline: a pre-game visual reaction and cognitive warm-up.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sightline">
  <title>Sightline</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Start screen -->
  <section id="screen-start" class="screen is-active" aria-labelledby="wordmark">
    <header class="start-head">
      <h1 id="wordmark" class="wordmark">SIGHT<span>LINE</span></h1>
      <div class="start-head__row">
        <p class="tagline">Game Ready warm-up</p>
        <button id="btn-guide" class="btn-link" type="button">How it works</button>
      </div>
    </header>
    <div id="update" class="update" hidden>
      <button id="btn-update" class="update__btn" type="button">New version ready — tap to update</button>
    </div>

    <form id="settings" class="settings" onsubmit="return false">
      <!-- segmented controls injected by settings.js -->
    </form>

    <div id="cone-setup" class="cone-setup" hidden>
      <p class="cone-setup__title">Cone setup — 3–5 yds from you</p>
      <div class="cone-grid" aria-label="Cone layout: green in front, red to the right, yellow behind, blue to the left">
        <!-- cones injected by settings.js -->
      </div>
    </div>

    <div class="start-foot">
      <p id="length-note" class="length-note"></p>
      <button id="btn-start" class="btn-start" type="button">START</button>
      <p class="disclaimer">A visual reaction &amp; cognitive warm-up. Not a medical, diagnostic, or treatment tool.</p>
      <div id="install" class="install" hidden></div>
      <p id="version" class="version"></p>
    </div>
  </section>

  <!-- Readiness check (before / after the session) -->
  <section id="screen-check" class="screen">
    <div id="check"></div>
  </section>

  <!-- Session screen -->
  <section id="screen-session" class="screen" aria-live="polite">
    <div class="hud">
      <div class="progress" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-fill" class="progress__fill"></div>
      </div>
      <div class="hud__row">
        <span id="hud-block" class="hud__block"></span>
        <span id="hud-time" class="hud__time"></span>
        <button id="btn-pause" class="btn-pause" type="button" aria-label="Pause"><span class="pause-icon" aria-hidden="true"></span></button>
      </div>
    </div>
    <div id="stage" class="stage"></div>

    <div id="pause-overlay" class="pause" hidden>
      <p class="pause__title">PAUSED</p>
      <button id="btn-resume" class="btn-big" type="button">RESUME</button>
      <button id="btn-quit" class="btn-ghost" type="button">End session</button>
    </div>
  </section>

  <!-- Session summary -->
  <section id="screen-done" class="screen">
    <div id="summary"></div>
    <button id="btn-done" class="btn-big btn-done" type="button">DONE</button>
  </section>

  <script type="module" src="js/main.js"></script>
</body>
</html>
